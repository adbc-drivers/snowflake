# Watches conventional-commit pushes to main and maintains a release PR for
# AdbcDrivers.Snowflake. Merging that PR is what creates the dotnet/v* tag
# and GitHub release that dotnet_release.yaml then builds and publishes.
name: Dotnet Tag

on:
  push:
    branches:
      - main
    paths:
      - 'csharp/src/AdbcDrivers.Snowflake/**'
      - 'csharp/Directory.Build.props'
      - 'release-please-config.json'
      - '.github/workflows/dotnet_tag.yaml'
      - '.github/workflows/dotnet_release.yaml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
