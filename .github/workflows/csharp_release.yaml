# Builds AdbcDrivers.Snowflake from the commit supplied by Release Please.
# Uploads to its draft release, then publishes it. Publishing only runs after
# approval on the nuget-release environment and authenticates to nuget.org via
# short-lived OIDC-issued trusted publishing, never a stored API key.
name: Csharp Publish Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name of the existing draft release, e.g. csharp/v1.0.1'
        required: true
        type: string
      release_sha:
        description: 'Full commit SHA to pack, supplied by Release Please'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate release inputs
        run: |
          [[ "$RELEASE_TAG" =~ ^csharp/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          submodules: true
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Pack matching release version
        run: |
          version=$(dotnet msbuild csharp/src/AdbcDrivers.Snowflake/AdbcDrivers.Snowflake.csproj -getProperty:VersionPrefix)
          test "$version" = "${RELEASE_TAG#csharp/v}"
          dotnet pack csharp/src/AdbcDrivers.Snowflake/AdbcDrivers.Snowflake.csproj -c Release -o artifacts -p:VersionSuffix=
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg

  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: nuget-release
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      # Draft releases require push access to see; keep this in the write-enabled job.
      - name: Verify draft release
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-package
          path: artifacts

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'artifacts/*.nupkg'

      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          # Individual NuGet username that created the Trusted Publishing policy.
          # Package ownership is selected separately in that policy.
          user: ${{ vars.NUGET_USER }}

      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      # The release stays editable until every package asset is attached.
      - name: Attach package to draft release
        run: gh release upload "$RELEASE_TAG" artifacts/*.nupkg --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}

      - name: Publish immutable release
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
