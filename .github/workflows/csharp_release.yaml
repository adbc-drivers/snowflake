# Builds and publishes AdbcDrivers.Snowflake once csharp_tag.yaml (release-please)
# has cut a csharp/v* tag. Packing has no secrets; publishing only runs after
# approval on the nuget-release environment and authenticates to nuget.org via
# short-lived OIDC-issued trusted publishing, never a stored API key.
name: Csharp Release

on:
  push:
    tags:
      - 'csharp/v*'

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - run: dotnet pack csharp/src/AdbcDrivers.Snowflake/AdbcDrivers.Snowflake.csproj -c Release -o artifacts -p:VersionSuffix=

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-package
          path: artifacts/*.nupkg

  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: nuget-release
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-package
          path: artifacts

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/*.nupkg'

      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          # Individual NuGet username that created the Trusted Publishing policy.
          # Package ownership is selected separately in that policy.
          user: ${{ vars.NUGET_USER }}

      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      # release-please already created the GitHub release for this tag; attach the package to it.
      - run: gh release upload "${GITHUB_REF_NAME}" artifacts/*.nupkg --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ github.token }}
