<% endif %>

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94  # v0.11.2
        with:
          pixi-version: <{tool_versions["pixi"]}>
          run-install: false

      - name: Install dev tools
        working-directory: <{ lang_subdir }>
        run: |
          pixi install

      - name: Log in to ghcr.io
        if: runner.os == 'Linux'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Add dumpbin to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) {
            throw "Could not find dumpbin.exe using vswhere"
          }
          Split-Path $dumpbin -Parent | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Library
        working-directory: <{ lang_subdir }>
<% if secrets["build:release"] %>
        env:
<% for name, val in secrets["build:release"].items() %>
          <{name}>: ${{ secrets.<{val}> }} # zizmor: ignore[secrets-outside-env]
<% endfor %>
<% endif %>
        run: |
          if [[ -f ci/scripts/pre-build.sh ]]; then
            ./ci/scripts/pre-build.sh release ${{ matrix.platform }} ${{ matrix.arch }}
          fi
          set -a
          if [[ -f .env.build ]]; then
            echo "Loading .env.build"
            source .env.build
          fi
          if [[ -f .env.release ]]; then
            source .env.release
          fi
          set +a
          pixi run adbc-make check CI=true VERBOSE=true <{' '.join(lang_config.build.additional_make_args) }><% if release %> RELEASE=true<% endif %>

          if [[ -f ci/scripts/post-build.sh ]]; then
            ./ci/scripts/post-build.sh release ${{ matrix.platform }} ${{ matrix.arch }}
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: drivers-${{ matrix.platform }}-${{ matrix.arch }}
          path: "<{ lang_subdir }>/build/libadbc_driver_<{driver}>.*"
          retention-days: 2

  package:
<% if stack_condition %>
    if: <{stack_condition}>
<% endif %>
    name: "Generate Packages"
    runs-on: ubuntu-latest
    needs:
      - build
<% if not lang_config.validation.skip %>
      - validate
<% endif %>
    permissions:
      contents: read

    steps:
<% if release or not secrets["all"] %>
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: 'recursive'
<% else %>
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: 'recursive'

      - name: "checkout remote"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
          submodules: 'recursive'
<% endif %>

<% if "go" in lang_tools %>
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          cache: <{"false" if release else "true"}>
          check-latest: true
          go-version: "stable"
<% endif %>
<% if "rust" in lang_tools %>
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          cache: <{"false" if release else "true"}>
          components: "clippy"
<% endif %>

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94  # v0.11.2
        with:
          pixi-version: <{tool_versions["pixi"]}>
          run-install: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: "drivers-*"
          path: "~/drivers"

      - name: Install tools
        working-directory: <{ lang_subdir }>
        run: |
<% if "go" in lang_tools %>
          # XXX: Google has effectively abandoned go-licenses, and it broke
          # XXX: can't install go-licenses under go 1.25
          # Use our fork instead
          # https://github.com/google/go-licenses/issues/312
          go install github.com/lidavidm/go-licenses@master
<% endif %>
<% if "rust" in lang_tools %>
          cargo install cargo-about --version <{tool_versions["cargo-about"]}> --locked -F cli
<% endif %>

      - name: Generate packages
        working-directory: <{ lang_subdir }>
        run: |
          pixi install

          pixi run adbc-gen-package \
            --name <{driver}> \
            --root $(pwd) \
            --manifest-template $(pwd)/manifest.toml \
            <% if release %>--release<% endif %> \
            -o ~/packages \
            ~/drivers/drivers-*-*/

          ls ~/packages

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: all-packages
          path: ~/packages
          retention-days: 7

<% if not lang_config.validation.skip %>
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: "validation-report-*"
          path: "~/validation-report"

      - name: Generate combined docs
        working-directory: <{ lang_subdir }>
        run: |
          ls -laR ~/validation-report
          find ~/validation-report -type f -name '*.xml'
          cp $(find ~/validation-report -type f -name '*.xml') .
          ls *.xml
          pixi run gendocs --output generated

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: docs
          path: "<{ lang_subdir }>/generated/<{driver}>.md"
          retention-days: 2
<% endif %>

<% if has_test_platforms %>
  test-packages:
<% if stack_condition %>
    if: <{stack_condition}>
<% endif %>
    name: "Test Packages/${{ matrix.platform }}_${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    needs:
      - package
    strategy:
      fail-fast: false
      matrix:
        include:
<% if "linux_amd64" not in lang_config.exclude_platforms %>
          - { platform: linux, arch: amd64, runner: ubuntu-latest }
<% endif %>
<% if "macos_arm64" not in lang_config.exclude_platforms %>
          - { platform: macos, arch: arm64, runner: macos-latest }
<% endif %>
<% if "windows_amd64" not in lang_config.exclude_platforms %>
          - { platform: windows, arch: amd64, runner: windows-latest }
<% endif %>
<% if lang_config.test_packages.environment %>
    environment: <{lang_config.test_packages.environment}>
<% endif %>
    steps:
      # for now, install dbc from main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          cache: <{"false" if release else "true"}>
          go-version: 'stable'
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94  # v0.11.2
        with:
          pixi-version: <{tool_versions["pixi"]}>
          run-install: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: "all-packages"
          path: "~/packages"
      - name: install package
        # dbc uses the filename as the driver name
        run: |
          echo "Installing dbc"
          git clone --depth 1 https://github.com/columnar-tech/dbc
          cd dbc
          go build ./cmd/dbc
          echo "Installed dbc"
          ls -laR ~/packages
          driver_pkg=$(find ~/packages -name '*_${{ matrix.platform }}_${{ matrix.arch }}_*.tar.gz')
          echo "Installing ${driver_pkg}"
          ./dbc install --no-verify "${driver_pkg}"
          echo "Installed ${driver_pkg}"
<% if release or not secrets["all"] %>
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: 'recursive'
<% else %>
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: 'recursive'
      - name: "checkout remote"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false
          submodules: 'recursive'
<% endif %>
      - name: load package
<% if private or secrets["build:test"] %>
        env:
<% if private %>
          COLUMNAR_CLOUD_API_TOKEN: ${{ secrets.COLUMNAR_CLOUD_API_TOKEN }} # zizmor: ignore[secrets-outside-env]
<% endif %>
<% if secrets["build:test"] %>
<% for name, val in secrets["build:test"].items() %>
          <{name}>: ${{ secrets.<{val}> }} # zizmor: ignore[secrets-outside-env]
<% endfor %>
<% endif %>
<% endif %>
        working-directory: <{ lang_subdir }>
        run: |
          if [[ -f ci/scripts/pre-build.sh ]]; then
            echo "Loading pre-build"
            ./ci/scripts/pre-build.sh test ${{ matrix.platform }} ${{ matrix.arch }}
          fi
          set -a
          if [[ -f .env.build ]]; then
            echo "Loading .env.build"
            source .env.build
          fi
          if [[ -f .env.ci ]]; then
            source .env.ci
          fi
          set +a
<% if private %>
          export COLUMNAR_DRIVER_LICENSE_KEY=$(curl --silent --fail -XGET -H 'Content-Type: application/json' -H "Authorization: Bearer $COLUMNAR_CLOUD_API_TOKEN" https://heimdall.columnar.tech/license)
<% endif %>
          pixi exec -s adbc-driver-manager -s pyarrow -s pytest python -m pytest -vs ci/test_package.py

<% endif %>

  release:
<% if stack_condition %>
    if: <{stack_condition}>
<% endif %>
<% if release %>
    name: "Release"
<% else %>
    name: "Release (Dry Run)"
<% endif %>
    runs-on: ubuntu-latest
    needs:
      - package
<% if has_test_platforms %>
      - test-packages
<% endif %>
<% if not lang_config.validation.skip %>
      - validate
<% endif %>
    permissions:
<% if release %>
      contents: write
<% else %>
      contents: read
<% endif %>

    steps:
<% if release or not secrets["all"] %>
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: 'recursive'
<% else %>
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: 'recursive'

      - name: "checkout remote"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
          submodules: 'recursive'
<% endif %>

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94  # v0.11.2
        with:
          pixi-version: <{tool_versions["pixi"]}>
          run-install: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: "all-packages"
          path: "~/packages"

<% if not lang_config.validation.skip %>
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: "docs"
          path: "~/packages"
<% endif %>

<% if release %>
      - name: Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: <{ lang_subdir }>
        run: |
          tag="${GITHUB_REF_NAME}"
<% if lang == "rust" %>
          declared_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [[ "${declared_version}" != "${tag#*v}" ]]; then
             echo "Declared driver version in Cargo.toml ${declared_version}"
             echo "does not match tag ${tag#*v}"
             echo "Please update the version before release."
             exit 1
          fi
<% endif %>
          pixi run release $(pwd) $tag
          gh release upload $tag $(find ~/packages -name '*.tar.gz') $(find ~/packages -name 'manifest.yaml') $(find ~/packages -name '*.md')

      - name: Release (dry-run)
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: <{ lang_subdir }>
        run: |
          git tag <{lang_tag_prefix}>v1000.0.0
          tag=<{lang_tag_prefix}>v1000.0.0

          pixi run release --dry-run $(pwd) $tag
          echo gh release upload $tag $(find ~/packages -name '*.tar.gz') $(find ~/packages -name 'manifest.yaml') $(find ~/packages -name '*.md')
<% else %>
      - name: Release (dry-run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: <{ lang_subdir }>
        run: |
          git tag <{lang_tag_prefix}>v1000.0.0
          tag=<{lang_tag_prefix}>v1000.0.0

          pixi run release --dry-run $(pwd) $tag
          echo gh release upload $tag $(find ~/packages -name '*.tar.gz') $(find ~/packages -name 'manifest.yaml') $(find ~/packages -name '*.md')
<% endif %>
