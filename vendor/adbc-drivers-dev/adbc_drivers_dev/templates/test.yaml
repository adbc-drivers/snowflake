# - Run tests
# - Build the shared library

name: <{lang_human}> <{workflow_name}>

on:
<% if not release %>
  pull_request:
    branches:
      - main
    paths:
      - "<{lang_path_glob}>"
<% for path in pull_request_trigger_paths %>
      - <{path}>
<% endfor %>
<% endif %>
  push:
<% if release %>
    tags:
      - "<{lang_tag_prefix}>v**"
<% else %>
    branches:
      - main
    paths:
      - "<{lang_path_glob}>"
<% for path in pull_request_trigger_paths %>
      - <{path}>
<% endfor %>
<% endif %>

<% if not release and secrets["all"] %>
  workflow_call:
    inputs:
      repository:
        description: "The repository to checkout (in owner/repo short format)"
        required: true
        type: string
      ref:
        description: "The ref to checkout"
        required: true
        type: string
    secrets:
<% for name, val in secrets["all"].items() %>
      <{val}>:
        required: true
<% endfor %>
<% endif %>
<% if release %>
  workflow_dispatch: {}
<% endif %>

concurrency:
<% if concurrency_key %>
  # Effectively prevents parallel tests - usually used for cloud workflows
  # Not necessary if you use environments + manual approval + trust the manual approval
  group: ${{ github.repository }}-<{concurrency_key}>
<% else %>
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}
<% endif %>
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

<% set has_test_platforms = ["linux_amd64", "macos_arm64", "windows_amd64"] | reject("in", lang_config.exclude_platforms) | list %>
<% set run_tests = not lang_config.test.skip and has_test_platforms %>

<% set stack_condition = none %>
<% if not release %>
<% if lang_config.github_stack_behavior == "bottom" %>
<% set stack_condition = "github.event_name != 'pull_request' || github.event.pull_request.stack == null || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref" %>
<% elif lang_config.github_stack_behavior == "top" %>
<% set stack_condition = "github.event_name != 'pull_request' || github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size" %>
<% endif %>
<% endif %>

jobs:
<% if run_tests %>
  test:
<% if stack_condition %>
    if: <{stack_condition}>
<% endif %>
    name: "Test/${{ matrix.platform }}_${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    strategy:
<% if driver == "snowflake" and lang == "rust" %>
      # LOCAL MODIFICATIONS: retain all Snowflake Rust matrix results.
      fail-fast: false
<% else %>
      fail-fast: true
<% endif %>
      matrix:
        include:
<% if "linux_amd64" not in lang_config.exclude_platforms %>
          - { platform: linux, arch: amd64, runner: ubuntu-latest }
<% endif %>
<% if "macos_arm64" not in lang_config.exclude_platforms %>
          - { platform: macos, arch: arm64, runner: macos-latest }
<% endif %>
<% if "windows_amd64" not in lang_config.exclude_platforms %>
          - { platform: windows, arch: amd64, runner: windows-latest }
<% endif %>
<% if lang_config.test.environment %>
    environment: <{lang_config.test.environment}>
<% endif %>
<% if driver == "snowflake" and lang == "rust" %>
    # LOCAL MODIFICATIONS: avoid Rust incremental cache pressure in Snowflake CI.
    env:
      CARGO_INCREMENTAL: 0
<% endif %>
    permissions:
      contents: read
<% if permissions.get("id_token") %>
      id-token: write
<% endif %>
      packages: read
    steps:
      - name: free up disk space
        if: runner.os != 'Windows'
        run: |
          # Preinstalled tools use a lot of disk space, free up some space
          # https://github.com/actions/runner-images/issues/2840
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

<% if release or not secrets["all"] %>
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: 'recursive'
<% else %>
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: 'recursive'

      - name: "checkout remote"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
          submodules: 'recursive'
<% endif %>

<% if "go" in lang_tools %>
