        with:
          cache: <{"false" if release else "true"}>
          components: "clippy"
<% endif %>

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94  # v0.11.2
        with:
          pixi-version: <{tool_versions["pixi"]}>
          run-install: false

<% if aws and lang_config.test.aws %>
