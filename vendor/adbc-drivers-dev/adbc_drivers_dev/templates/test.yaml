        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          service_account: ${{ secrets.gcloud_service_account }}
          workload_identity_provider: ${{ secrets.gcloud_workload_identity_provider }}
<% endif %>

      - name: Log in to ghcr.io
        if: runner.os == 'Linux'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build
<% if secrets["build:test"] %>
        env:
<% for name, val in secrets["build:test"].items() %>
          <{name}>: ${{ secrets.<{val}> }} # zizmor: ignore[secrets-outside-env]
<% endfor %>
<% endif %>
        working-directory: <{ lang_subdir }>
        run: |
          if [[ -f ci/scripts/pre-build.sh ]]; then
            echo "Loading pre-build"
            ./ci/scripts/pre-build.sh test ${{ matrix.platform }} ${{ matrix.arch }}
          fi

          set -a
          if [[ -f .env.build ]]; then
            echo "Loading .env.build"
            source .env.build
          fi
          set +a

<% if lang == "go" %>
          go build ./...
<% elif lang == "rust" %>
          cargo build --locked
<% elif lang == "script" %>
          ./ci/scripts/build.sh test ${{ matrix.platform }} ${{ matrix.arch }}
<% else %>
<{not_implemented(lang)}>
<% endif %>

      - name: Start Test Dependencies
        # Can't use Docker on macOS AArch64 runners, and Windows containers
        # work but often the container doesn't support Windows
        if: runner.os == 'Linux'
        working-directory: <{ lang_subdir }>
        run: |
          if [[ -f compose.yaml ]]; then
            if ! docker compose up --detach --wait <{lang_config.test.service_name}>; then
              echo "Service failed to start"
              echo "Logs:"
              docker compose logs <{lang_config.test.service_name}>
              exit 1
            fi
          fi

      - name: Test
<% if secrets["test"] %>
        env:
<% for name, val in secrets["test"].items() %>
          <{name}>: ${{ secrets.<{val}> }} # zizmor: ignore[secrets-outside-env]
<% endfor %>
<% endif %>
        working-directory: <{ lang_subdir }>
        run: |
          set -a
          if [[ -f .env ]]; then
            source .env
          fi
          if [[ -f .env.${{ matrix.platform }} ]]; then
            source .env.${{ matrix.platform }}
          fi
          if [[ -f .env.ci ]]; then
            source .env.ci
          fi
          set +a

          if [[ -f ci/scripts/pre-test.sh ]]; then
            echo "Loading pre-test"
            ./ci/scripts/pre-test.sh ${{ matrix.platform }} ${{ matrix.arch }} "<{lang_config.test.service_name}>"
          fi

          # if pre-test.sh needs to override env vars, it can generate this file
          set -a
          if [[ -f .env.override ]]; then
            source .env.override
          fi
          set +a

<% if lang == "go" %>
          go test -timeout <{lang_config.test.timeout_minutes}>m -tags assert -v ./...
<% elif lang == "rust" %>
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            /usr/bin/perl -e 'alarm shift; exec @ARGV' <{lang_config.test.timeout_minutes * 60}> cargo test
          else
            timeout <{lang_config.test.timeout_minutes}>m cargo test
          fi
<% elif lang == "script" %>
          ./ci/scripts/test.sh ${{ matrix.platform }} ${{ matrix.arch }}
<% else %>
<{not_implemented(lang)}>
<% endif %>

<% if file_exists("ci/scripts/post-test.sh") %>
      - name: Post-Test
        if: always()
<% if secrets["test"] %>
        env:
<% for name, val in secrets["test"].items() %>
          <{name}>: ${{ secrets.<{val}> }} # zizmor: ignore[secrets-outside-env]
<% endfor %>
<% endif %>
        working-directory: <{ lang_subdir }>
        run: |
          set -a
          if [[ -f .env ]]; then
            source .env
          fi
          if [[ -f .env.${{ matrix.platform }} ]]; then
            source .env.${{ matrix.platform }}
          fi
          if [[ -f .env.ci ]]; then
            source .env.ci
          fi
          if [[ -f .env.override ]]; then
            source .env.override
          fi
          set +a

          ./ci/scripts/post-test.sh
<% endif %>

<% if lang == "go" %>
      - name: go mod tidy
        if: runner.os == 'Linux'
        working-directory: <{ lang_subdir }>
        run: |
          go mod tidy --diff
<% elif lang == "rust" %>
      - name: clippy
        working-directory: <{ lang_subdir }>
        run: |
<% if driver == "snowflake" and lang == "rust" %>
          # LOCAL MODIFICATIONS: keep Snowflake Rust formatting in the lint job.
          cargo fmt --check
<% endif %>
          cargo clippy --locked --no-deps -- -A unused_variables -D warnings
<% if file_exists("deny.toml") %>

      - name: cargo deny
        if: runner.os == 'Linux'
        working-directory: <{ lang_subdir }>
        run: |
          cargo install cargo-deny --version <{tool_versions["cargo-deny"]}> --locked
          cargo deny --all-features --locked check
<% endif %>
<% endif %>
<% endif %>

