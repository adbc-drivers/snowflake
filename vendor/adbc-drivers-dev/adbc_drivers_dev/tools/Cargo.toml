# Version data for Dependabot and workflow generation, not a crate to build.
# No Rust sources or Cargo.lock are needed here.
[package]
name = "adbc-ci-tool-versions"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
cargo-deny = "=0.20.2"
cargo-about = "=0.9.2"
pixi = { git = "https://github.com/prefix-dev/pixi", tag = "v0.82.0" }
